services:
  email2api:
    build: .
    image: email2api:local
    restart: unless-stopped
    environment:
      EMAIL2API_TOKEN: ${EMAIL2API_TOKEN:?EMAIL2API_TOKEN must be at least 32 characters}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-10}
      PORT: 3000
    ports:
      - "${EMAIL2API_PORT:-3000}:3000"
    volumes:
      - email2api-data:/data

volumes:
  email2api-data:
